<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="AMO 2026 — 88% de la population couverte">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2459"/>
      <stop offset="0.55" stop-color="#161C46"/>
      <stop offset="1" stop-color="#10153A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#149D92" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#149D92" stop-opacity="0"/>
    </radialGradient>
    <pattern id="zellige" width="64" height="64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
        <rect x="20" y="20" width="24" height="24"/>
        <rect x="20" y="20" width="24" height="24" transform="rotate(45 32 32)"/>
        <circle cx="32" cy="32" r="4.5"/>
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#zellige)"/>
  <rect width="1200" height="675" fill="url(#halo)"/>

  <g font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <text x="80" y="140" fill="#5BD0C4" font-size="24" font-weight="700" letter-spacing="3">ACTUALITÉS · PROTECTION SOCIALE</text>

    <text x="80" y="270" fill="#F4F2FB" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700">Généralisation</text>
    <text x="80" y="370" fill="#F4F2FB" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700">de l'<tspan fill="#5BD0C4">AMO</tspan> au Maroc</text>

    <text x="80" y="470" fill="#C9CDE6" font-size="30" font-weight="500">Où en est le chantier en 2026 ?</text>

    <!-- Stat -->
    <text x="80" y="600" fill="#E9A23B" font-size="110" font-weight="800" letter-spacing="-2">88%</text>
    <text x="330" y="575" fill="#EDEAF6" font-size="30" font-weight="700">de la population</text>
    <text x="330" y="612" fill="#AEB4D6" font-size="24" font-weight="500">désormais couverte (vs 42% avant)</text>

    <text x="1120" y="620" text-anchor="end" fill="#8A90B8" font-size="22" font-weight="700" letter-spacing="1">SimulRH</text>
  </g>
</svg>
