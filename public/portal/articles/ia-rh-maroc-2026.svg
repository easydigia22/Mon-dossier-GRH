<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="L'IA dans les RH au Maroc — 96% des DRH anticipent la digitalisation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2459"/>
      <stop offset="0.55" stop-color="#161C46"/>
      <stop offset="1" stop-color="#10153A"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.84" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#149D92" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#149D92" stop-opacity="0"/>
    </radialGradient>
    <pattern id="zellige" width="64" height="64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
        <rect x="20" y="20" width="24" height="24"/>
        <rect x="20" y="20" width="24" height="24" transform="rotate(45 32 32)"/>
        <circle cx="32" cy="32" r="4.5"/>
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#zellige)"/>
  <rect width="1200" height="675" fill="url(#halo)"/>

  <!-- Noeud IA stylisé en haut à droite -->
  <g stroke="#5BD0C4" stroke-opacity="0.5" fill="#5BD0C4" fill-opacity="0.5">
    <circle cx="1000" cy="150" r="7"/>
    <circle cx="1090" cy="110" r="5"/>
    <circle cx="1080" cy="210" r="5"/>
    <circle cx="930" cy="110" r="4"/>
    <line x1="1000" y1="150" x2="1090" y2="110" stroke-width="1.5"/>
    <line x1="1000" y1="150" x2="1080" y2="210" stroke-width="1.5"/>
    <line x1="1000" y1="150" x2="930" y2="110" stroke-width="1.5"/>
  </g>

  <g font-family="'Plus Jakarta Sans', Arial, sans-serif">
    <text x="80" y="140" fill="#5BD0C4" font-size="24" font-weight="700" letter-spacing="3">ACTUALITÉS · ENTREPRISE</text>

    <text x="80" y="270" fill="#F4F2FB" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700">L'<tspan fill="#5BD0C4">IA</tspan> dans les RH</text>
    <text x="80" y="366" fill="#F4F2FB" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700">au Maroc</text>

    <text x="80" y="462" fill="#C9CDE6" font-size="30" font-weight="500">Pourquoi 2026 est un tournant pour la fonction RH</text>

    <text x="80" y="600" fill="#E9A23B" font-size="110" font-weight="800" letter-spacing="-2">96%</text>
    <text x="340" y="575" fill="#EDEAF6" font-size="30" font-weight="700">des DRH marocains</text>
    <text x="340" y="612" fill="#AEB4D6" font-size="24" font-weight="500">anticipent l'accélération de la digitalisation RH</text>

    <text x="1120" y="620" text-anchor="end" fill="#8A90B8" font-size="22" font-weight="700" letter-spacing="1">SimulRH</text>
  </g>
</svg>
